<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="520" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">Wire the LED to pin 0 and GND</text>
  <!-- micro:bit -->
  <rect x="60" y="70" width="330" height="270" rx="26" fill="#1d1d1f"/>
  <g fill="#3a3a3d">
    <rect x="165" y="120" width="120" height="120" rx="6" fill="#2a2a2d"/>
  </g>
  <g fill="#ff5a4f">
    <circle cx="185" cy="140" r="5"/><circle cx="205" cy="140" r="5"/><circle cx="225" cy="140" r="5"/><circle cx="245" cy="140" r="5"/><circle cx="265" cy="140" r="5"/>
    <circle cx="185" cy="160" r="5"/><circle cx="205" cy="160" r="5"/><circle cx="225" cy="160" r="5"/><circle cx="245" cy="160" r="5"/><circle cx="265" cy="160" r="5"/>
    <circle cx="185" cy="180" r="5"/><circle cx="205" cy="180" r="5"/><circle cx="225" cy="180" r="5"/><circle cx="245" cy="180" r="5"/><circle cx="265" cy="180" r="5"/>
    <circle cx="185" cy="200" r="5"/><circle cx="205" cy="200" r="5"/><circle cx="225" cy="200" r="5"/><circle cx="245" cy="200" r="5"/><circle cx="265" cy="200" r="5"/>
    <circle cx="185" cy="220" r="5"/><circle cx="205" cy="220" r="5"/><circle cx="225" cy="220" r="5"/><circle cx="245" cy="220" r="5"/><circle cx="265" cy="220" r="5"/>
  </g>
  <circle cx="105" cy="180" r="18" fill="#4a4a4f"/><text x="105" y="187" text-anchor="middle" font-size="18" fill="#fff">A</text>
  <circle cx="345" cy="180" r="18" fill="#4a4a4f"/><text x="345" y="187" text-anchor="middle" font-size="18" fill="#fff">B</text>
  <!-- edge pins -->
  <g fill="#d4a017">
    <rect x="72" y="282" width="46" height="58"/><rect x="134" y="282" width="46" height="58"/><rect x="202" y="282" width="46" height="58"/><rect x="270" y="282" width="46" height="58"/><rect x="332" y="282" width="46" height="58"/>
  </g>
  <g fill="#1d1d1f"><circle cx="95" cy="318" r="11"/><circle cx="157" cy="318" r="11"/><circle cx="225" cy="318" r="11"/><circle cx="293" cy="318" r="11"/><circle cx="355" cy="318" r="11"/></g>
  <g font-size="17" font-weight="bold" fill="#111" text-anchor="middle">
    <text x="95" y="366">0</text><text x="157" y="366">1</text><text x="225" y="366">2</text><text x="293" y="366">3V</text><text x="355" y="366">GND</text>
  </g>
  <!-- red wire: pin 0 to resistor -->
  <path d="M95 318 C 95 470, 430 470, 470 300" fill="none" stroke="#e02424" stroke-width="7" stroke-linecap="round"/>
  <!-- resistor -->
  <rect x="452" y="230" width="36" height="70" rx="8" fill="#e8d3a3" stroke="#8a6d3b" stroke-width="2"/>
  <rect x="452" y="244" width="36" height="7" fill="#8a4b00"/><rect x="452" y="260" width="36" height="7" fill="#111"/><rect x="452" y="276" width="36" height="7" fill="#b8860b"/>
  <line x1="470" y1="230" x2="470" y2="190" stroke="#777" stroke-width="4"/>
  <!-- resistor to LED long leg -->
  <path d="M470 190 C 470 150, 560 160, 590 200" fill="none" stroke="#777" stroke-width="4"/>
  <!-- LED -->
  <path d="M580 130 a40 40 0 0 1 80 0 v40 h-80 z" fill="#ff5a4f" stroke="#b3261e" stroke-width="2"/>
  <rect x="574" y="170" width="92" height="12" rx="3" fill="#ff8a80" stroke="#b3261e" stroke-width="2"/>
  <line x1="600" y1="182" x2="600" y2="270" stroke="#777" stroke-width="4"/>
  <line x1="640" y1="182" x2="640" y2="240" stroke="#777" stroke-width="4"/>
  <!-- black wire: short leg to GND -->
  <path d="M640 240 C 660 500, 360 500, 355 318" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <!-- labels -->
  <g font-size="17" fill="#111">
    <text x="500" y="270">resistor</text>
    <text x="520" y="215" font-size="15">long leg</text>
    <text x="652" y="215" font-size="15">short leg</text>
    <text x="680" y="150">LED</text>
    <text x="200" y="455" fill="#e02424" font-weight="bold">red clip: pin 0</text>
    <text x="470" y="500" fill="#111" font-weight="bold">black clip: GND</text>
  </g>
</svg>
